name: Buildroot release cache
description: Restore sealed SDKs and PHP payloads from the persistent build cache.

inputs:
    mode:
        required: true
        description: '"restore" or "save".'
    key:
        required: true
        description: Exact source/configuration/toolchain identity.
    seed-key:
        required: false
        default: ''
        description: Seed identity; library SDKs reuse the same producer and architecture slot.
    fail-on-cache-miss:
        required: false
        default: 'false'
        description: Require the exact compiled SDK; never accept a compatible seed.
    path:
        required: false
        default: buildroot.tar.zst
        description: Local compiled SDK archive.

outputs:
    cache-hit:
        description: '"true" when an exact source identity was restored.'
        value: ${{ steps.run.outputs.cache-hit }}
    seed-hit:
        description: '"true" when a compatible previous SDK was restored.'
        value: ${{ steps.run.outputs.seed-hit }}
    cache-current:
        description: '"true" when the exact SDK is already in the persistent cache.'
        value: ${{ steps.run.outputs.cache-current }}
    restored-key:
        description: Exact identity of the restored SDK.
        value: ${{ steps.run.outputs.restored-key }}

runs:
    using: composite
    steps:
        -   id: run
            shell: bash
            env:
                MODE: ${{ inputs.mode }}
                KEY: ${{ inputs.key }}
                SEED_KEY: ${{ inputs.seed-key }}
                FAIL_ON_MISS: ${{ inputs.fail-on-cache-miss }}
                LOCAL_FILE: ${{ inputs.path }}
                REPO: ${{ github.repository }}
                GH_TOKEN: ${{ github.token }}
            run: |
                python=python3
                if command -v python3.9 >/dev/null 2>&1; then python=python3.9; fi
                "$python" "$GITHUB_ACTION_PATH/cache.py"
