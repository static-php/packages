name: Build and upload Alpine APK packages to Forgejo

on:
    workflow_dispatch:
        inputs:
            mode:
                description: "Full manual build or incremental source build plan"
                type: choice
                options: [full, incremental]
                default: full
            libraries:
                description: "Optional: shared library IDs (comma-separated)"
                default: ""
            downloads_run_id:
                description: "Optional: pin the spc-download source snapshot"
                default: ""
            iteration:
                description: "Optional: override package iteration"
                default: ""
            bump:
                description: "Bump package revisions above published packages"
                type: boolean
                default: false
            php_versions:
                description: "Optional: PHP streams (comma-separated); ABI transitions include all affected streams"
                default: ""
            architectures:
                description: "Optional: architectures (comma-separated)"
                default: ""
            packages:
                description: "Optional: PHP package selection"
                default: ""
            publish:
                description: "Publish verified packages (false builds and tests only)"
                type: boolean
                default: false
            debug_tmate:
                description: "Open tmate on failure"
                type: boolean
                default: false
    repository_dispatch:
        types: [spc-download]

permissions:
    contents: read
    packages: read

concurrency:
    group: ${{ inputs.publish == true && 'shared-packages-apk' || format('shared-packages-apk-test-{0}', github.run_id) }}
    cancel-in-progress: false

jobs:
    setup-matrix:
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
            packages: read
        outputs:
            downloads-run-id: ${{ steps.source.outputs.run-id }}
            matrix: ${{ steps.matrix.outputs.matrix }}
            php-versions: ${{ steps.matrix.outputs.php-versions }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Resolve one source snapshot for the entire build
                id: source
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    REQUESTED_RUN_ID: ${{ inputs.downloads_run_id }}
                run: |
                    set -euo pipefail
                    source_run="$REQUESTED_RUN_ID"
                    if [[ -z "$source_run" ]]; then
                        runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/spc-download.yml/runs?status=success&per_page=100" --paginate --jq '.workflow_runs[].id')
                        for candidate in $runs; do
                            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --paginate --jq '.artifacts[] | select(.name == "downloads-tarball" and .expired == false) | .id')
                            if [[ -n "$available" ]]; then
                                source_run="$candidate"
                                break
                            fi
                        done
                    fi
                    if [[ ! "$source_run" =~ ^[0-9]+$ ]]; then
                        echo '::error::No available spc-download source snapshot'
                        exit 1
                    fi
                    echo "run-id=$source_run" >> "$GITHUB_OUTPUT"
            -   name: Log in to builder registry
                env:
                    REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    ACTOR: ${{ github.actor }}
                run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            -   name: Set target matrix and pin shared images
                id: matrix
                env:
                    ARCHITECTURES: ${{ inputs.architectures }}
                    PHP_VERSIONS: ${{ inputs.php_versions }}
                run: |
                    python3 .github/actions/shared-libraries/workflow.py setup --type=apk \
                        --architectures "$ARCHITECTURES" \
                        --php-versions "$PHP_VERSIONS" --resolve-images >> "$GITHUB_OUTPUT"

    build-libs:
        name: Build libs shared (${{ matrix.target }})
        needs: setup-matrix
        runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
        permissions:
            contents: write
            packages: read
            actions: read
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
        env:
            SOURCE_RUN_ID: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            TYPE: apk
            TARGET: ${{ matrix.target }}
            MATRIX_ARCH: ${{ matrix.arch }}
            MODE: ${{ inputs.mode || 'full' }}
            LIBRARIES: ${{ inputs.libraries || '' }}
            PHP_VERSIONS: ${{ inputs.php_versions || '' }}
            PACKAGES: ${{ matrix.packages || inputs.packages || '' }}
            PHPV: ${{ matrix.php-version || '' }}
            ITERATION: ${{ inputs.iteration || '' }}
            BUMP: ${{ inputs.bump || false }}
            PUBLISH: ${{ inputs.publish || false }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            FORGEJO_PASSWORD: ${{ secrets.FORGEJO_PASSWORD }}
            IMAGE: ${{ matrix.image }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Download pinned source snapshot
                run: |
                    python3 .github/actions/shared-libraries/source-snapshot.py fetch
                    python3 .github/actions/shared-libraries/workflow.py validate-source --mode "$MODE"
            -   name: Log in to GHCR and pull builder
                env:
                    ACTOR: ${{ github.actor }}
                run: |
                    echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
                    docker pull "$IMAGE"
            -   name: Prepare Composer cache
                run: mkdir -p ~/.cache/composer
            -   name: Restore Composer downloads
                id: composer-cache
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ hashFiles('**/composer.lock') }}
                    restore-keys: composer-
            -   name: Compute source and toolchain fingerprint
                id: fingerprint
                run: bash .github/actions/shared-libraries/run.sh fingerprint >> "$GITHUB_OUTPUT"
            -   name: Compute buildroot cache key
                id: cache-key
                env:
                    FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
                    COMPATIBILITY: ${{ steps.fingerprint.outputs.compatibility }}
                run: |
                    echo "key=buildroot-shared-$TYPE-$TARGET-$FINGERPRINT" >> "$GITHUB_OUTPUT"
                    echo "seed-key=buildroot-shared-seed-$TYPE-$TARGET-$COMPATIBILITY" >> "$GITHUB_OUTPUT"
            -   name: Restore buildroot cache
                id: cache
                uses: ./.github/actions/buildroot-cache
                with:
                    mode: restore
                    key: ${{ steps.cache-key.outputs.key }}
                    seed-key: ${{ steps.cache-key.outputs.seed-key }}
            -   name: Extract restored buildroot
                if: steps.cache.outputs.cache-hit == 'true' || steps.cache.outputs.seed-hit == 'true'
                run: tar --zstd -xf buildroot.tar.zst
            -   name: Build changed shared libraries
                run: bash .github/actions/shared-libraries/run.sh libs
            -   name: Classify ABI and package shared libraries
                id: classification
                run: |
                    bash .github/actions/shared-libraries/run.sh classify
                    echo "php-required=$(jq 'any(.php_requests[]; .full or (.packages | length > 0))' stage/shared-library-plan.json)" >> "$GITHUB_OUTPUT"
                    python3 .github/actions/shared-libraries/workflow.py inline --plan stage/shared-library-plan.json >> "$GITHUB_OUTPUT"
            -   name: Build single PHP stream in the restored SDK workspace
                if: steps.classification.outputs.inline-stream != ''
                uses: ./.github/actions/apk-packages
                env:
                    PHPV: ${{ steps.classification.outputs.inline-stream }}
                    LIBRARY_ONLY: false
                    PACKAGES: ${{ fromJson(steps.classification.outputs.inline-request || '{}').packages }}
                    COMPILE: ${{ fromJson(steps.classification.outputs.inline-request || '{}').compile }}
                    COMPILE_PACKAGES: ${{ fromJson(steps.classification.outputs.inline-request || '{}').compile-packages }}
                    ABI_REBUILD_LIBRARIES: ${{ fromJson(steps.classification.outputs.inline-request || '{}').abi-rebuild-libraries }}
                    ABI_BREAK: ${{ fromJson(steps.classification.outputs.inline-request || '{}').abi-break }}
                    ABI_CORE_REBUILD: ${{ fromJson(steps.classification.outputs.inline-request || '{}').abi-core-rebuild }}
                    RUNTIME_CHECKS: ${{ fromJson(steps.classification.outputs.inline-request || '{}').runtime-checks }}
                    TLS_CHECKS: ${{ fromJson(steps.classification.outputs.inline-request || '{}').tls-checks }}
            -   name: Pack buildroot
                if: inputs.publish == true || (steps.classification.outputs.php-required == 'true' && steps.classification.outputs.inline-stream == '')
                run: tar --zstd -cf buildroot.tar.zst buildroot
            -   name: Save buildroot cache
                if: inputs.publish == true && (steps.cache.outputs.cache-current != 'true' || hashFiles('stage/sdk-rebuilt') != '')
                uses: ./.github/actions/buildroot-cache
                with:
                    mode: save
                    key: ${{ steps.cache-key.outputs.key }}
                    seed-key: ${{ steps.cache-key.outputs.seed-key }}
            -   name: Record target and buildroot
                env:
                    CACHE_KEY: ${{ steps.cache-key.outputs.key }}
                    ALMA: ${{ matrix.alma }}
                run: bash .github/actions/shared-libraries/run.sh record
            -   name: Stage target plan
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-plans-apk-${{ matrix.target }}
                    path: |
                        stage/shared-library-plan.json
                        stage/target.json
                    retention-days: 7
            -   name: Stage common SDK buildroot
                if: steps.classification.outputs.php-required == 'true' && steps.classification.outputs.inline-stream == ''
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-sdk-buildroot-apk-${{ matrix.target }}
                    path: buildroot.tar.zst
                    compression-level: 0
                    retention-days: 1
            -   name: Stage library packages
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-libs-apk-${{ matrix.target }}
                    path: stage
                    retention-days: 7
            -   name: Upload logs on failure
                if: ${{ failure() }}
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: logs-libs-apk-${{ matrix.target }}
                    path: log
            -   name: Debug build failure
                if: ${{ failure() && inputs.debug_tmate == true }}
                uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3
                timeout-minutes: 30
            -   name: Save Composer downloads
                if: inputs.publish == true && steps.composer-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ hashFiles('**/composer.lock') }}

    compute-build-matrix:
        needs: [setup-matrix, build-libs]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
        outputs:
            matrix: ${{ steps.filter.outputs.matrix }}
            any: ${{ steps.filter.outputs.any }}
            publish-matrix: ${{ steps.filter.outputs.publish-matrix }}
            publish-any: ${{ steps.filter.outputs.publish-any }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Download target plans
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                continue-on-error: true
                with:
                    pattern: shared-plans-apk-*
                    path: plans
            -   name: Filter successful targets and select PHP consumers
                id: filter
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    PHP_VERSIONS: ${{ inputs.php_versions }}
                run: |
                    set -euo pipefail
                    succeeded=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
                        --jq '.jobs[] | select(.conclusion == "success" and (.name | test("^Build libs shared \\("))) | .name' \
                        | sed -E 's/^Build libs shared \(([^)]+)\)$/\1/' | sort -u)
                    python3 .github/actions/shared-libraries/workflow.py matrix --plans plans \
                        --php-versions "$PHP_VERSIONS" --succeeded "$succeeded" >> "$GITHUB_OUTPUT"

    build:
        name: Build (${{ matrix.target }} php${{ matrix.php-version }})
        needs: [setup-matrix, compute-build-matrix]
        if: ${{ !cancelled() && needs.compute-build-matrix.outputs.any == 'true' }}
        runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
        permissions:
            contents: write
            packages: read
            actions: read
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.compute-build-matrix.outputs.matrix) }}
        env:
            SOURCE_RUN_ID: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            TYPE: apk
            TARGET: ${{ matrix.target }}
            MATRIX_ARCH: ${{ matrix.arch }}
            MODE: ${{ inputs.mode || 'full' }}
            LIBRARIES: ${{ inputs.libraries || '' }}
            PHP_VERSIONS: ${{ inputs.php_versions || '' }}
            PACKAGES: ${{ matrix.packages }}
            COMPILE: ${{ matrix.compile }}
            COMPILE_PACKAGES: ${{ matrix.compile-packages }}
            ABI_BREAK: ${{ matrix.abi-break }}
            ABI_CORE_REBUILD: ${{ matrix.abi-core-rebuild }}
            RUNTIME_CHECKS: ${{ matrix.runtime-checks }}
            TLS_CHECKS: ${{ matrix.tls-checks }}
            ABI_REBUILD_LIBRARIES: ${{ matrix.abi-rebuild-libraries }}
            LIBRARY_ONLY: ${{ matrix.library-only || false }}
            PHPV: ${{ matrix.php-version || '' }}
            ITERATION: ${{ inputs.iteration || '' }}
            BUMP: ${{ inputs.bump || false }}
            PUBLISH: ${{ inputs.publish || false }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            FORGEJO_PASSWORD: ${{ secrets.FORGEJO_PASSWORD }}
            IMAGE: ${{ matrix.image }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Download pinned source snapshot
                if: matrix.library-only != true
                run: |
                    python3 .github/actions/shared-libraries/source-snapshot.py fetch
                    python3 .github/actions/shared-libraries/workflow.py validate-source --mode "$MODE"
            -   name: Log in to GHCR and pull builder
                env:
                    ACTOR: ${{ github.actor }}
                run: |
                    echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
                    docker pull "$IMAGE"
            -   name: Download shared library packages and plan
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    name: shared-libs-apk-${{ matrix.target }}
                    path: stage
            -   name: Copy matching library archives
                run: |
                    mkdir -p dist/apk stage/libraries
                    find stage/libraries -maxdepth 1 -name '*.apk' -exec cp -a {} dist/apk/ \;
            -   name: Download exact common SDK
                if: matrix.library-only != true
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    name: shared-sdk-buildroot-apk-${{ matrix.target }}
            -   name: Extract buildroot
                if: matrix.library-only != true
                run: tar --zstd -xf buildroot.tar.zst
            -   name: Prepare Composer cache
                if: matrix.library-only != true
                run: mkdir -p ~/.cache/composer
            -   name: Restore Composer downloads
                if: matrix.library-only != true
                id: composer-cache
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ hashFiles('**/composer.lock') }}
                    restore-keys: composer-
            -   name: Build and validate native APK packages
                uses: ./.github/actions/apk-packages
            -   name: Upload logs on failure
                if: ${{ failure() }}
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: logs-php-apk-${{ matrix.target }}-${{ matrix.php-version }}
                    path: log
            -   name: Debug build failure
                if: ${{ failure() && inputs.debug_tmate == true }}
                uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3
                timeout-minutes: 30
            -   name: Save Composer downloads
                if: inputs.publish == true && steps.composer-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ hashFiles('**/composer.lock') }}

    publish:
        name: Publish (apk ${{ matrix.target }})
        needs: [setup-matrix, compute-build-matrix, build]
        if: ${{ !cancelled() && inputs.publish == true && needs.compute-build-matrix.outputs.publish-any == 'true' }}
        permissions:
            contents: read
            packages: read
            actions: read
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.compute-build-matrix.outputs.publish-matrix) }}
        uses: ./.github/workflows/publish-package-cohort.yml
        with:
            format: apk
            target: ${{ matrix.target }}
            arch: ${{ matrix.arch }}
            image: ${{ matrix.image }}
            source-run-id: ${{ needs.setup-matrix.outputs.downloads-run-id }}
        secrets: inherit
