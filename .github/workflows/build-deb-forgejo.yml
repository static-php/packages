name: Build Debian packages through shared EL8 pipeline

on:
    workflow_dispatch:
        inputs:
            mode:
                description: "Full manual build or incremental source build plan"
                type: choice
                options: [full, incremental]
                default: full
            libraries:
                description: "Optional: shared library IDs (comma-separated)"
                default: ""
            downloads_run_id:
                description: "Optional: pin the spc-download source snapshot"
                default: ""
            repackage_run_id:
                description: "Optional: repackage recorded sealed outputs from this build run without compilation"
                type: string
                default: ""
            iteration:
                description: "Optional: override package iteration"
                default: ""
            bump:
                description: "Bump package revisions above published packages"
                type: boolean
                default: false
            publish:
                description: "Publish validated packages and reusable buildroot caches"
                type: boolean
                default: false
            php_versions:
                description: "Optional: PHP streams (comma-separated); ABI transitions include all affected streams"
                default: ""
            architectures:
                description: "Optional: architectures (comma-separated)"
                default: ""
            packages:
                description: "Optional: PHP package selection"
                default: ""
            debug_tmate:
                description: "Open tmate on failure"
                type: boolean
                default: false
    workflow_call:
        inputs:
            mode:
                type: string
                required: false
                default: "full"
            libraries:
                type: string
                required: false
                default: ""
            downloads_run_id:
                type: string
                required: false
                default: ""
            repackage_run_id:
                type: string
                required: false
                default: ""
            iteration:
                type: string
                required: false
                default: ""
            bump:
                type: boolean
                required: false
                default: false
            publish:
                type: boolean
                required: false
                default: false
            php_versions:
                type: string
                required: false
                default: ""
            architectures:
                type: string
                required: false
                default: ""
            packages:
                type: string
                required: false
                default: ""
            debug_tmate:
                type: boolean
                required: false
                default: false

permissions:
    contents: write
    packages: read
    actions: read

jobs:
    build:
        name: Build shared EL8 RPM and DEB packages
        permissions:
            contents: write
            packages: read
            actions: write
        uses: ./.github/workflows/build-rpm-modular-packages.yml
        with:
            mode: ${{ inputs.mode }}
            libraries: ${{ inputs.libraries }}
            downloads_run_id: ${{ inputs.downloads_run_id }}
            repackage_run_id: ${{ inputs.repackage_run_id }}
            iteration: ${{ inputs.iteration }}
            bump: ${{ inputs.bump }}
            publish: ${{ inputs.publish }}
            php_versions: ${{ inputs.php_versions }}
            architectures: ${{ inputs.architectures }}
            packages: ${{ inputs.packages }}
            debug_tmate: ${{ inputs.debug_tmate }}
        secrets: inherit
