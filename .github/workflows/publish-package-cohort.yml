name: Publish package cohort

on:
    workflow_call:
        inputs:
            format:
                type: string
                required: true
            target:
                type: string
                required: true
            arch:
                type: string
                required: true
            image:
                description: Pinned producer image
                type: string
                required: true
            package-image-digest:
                description: SHA256 digest of the RPM or DEB packaging image
                type: string
                default: ""
            source-run-id:
                description: Recorded source-download run
                type: string
                required: true
            build-run-id:
                description: Package build run; empty uses the current run
                type: string
                default: ""
            artifact-ids:
                description: Exact artifact IDs; empty uses the current target pattern
                type: string
                default: ""

permissions:
    contents: read
    packages: read
    actions: read

concurrency:
    group: shared-publish-${{ inputs.format }}-${{ inputs.target }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

env:
    TYPE: ${{ inputs.format }}
    TARGET: ${{ inputs.target }}
    MATRIX_ARCH: ${{ inputs.arch }}
    IMAGE: ${{ inputs.image }}
    SOURCE_RUN_ID: ${{ inputs.source-run-id }}
    GLIBC_PIPELINE: ${{ inputs.format != 'apk' }}
    GITHUB_TOKEN: ${{ github.token }}
    FORGEJO_PASSWORD: ${{ secrets.FORGEJO_PASSWORD }}
    RPM_HOST: github@${{ secrets.DEB_SERVER_IP }}
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    publish-glibc:
        name: Publish glibc cohort
        if: inputs.format == 'rpm' || inputs.format == 'deb'
        runs-on: ubuntu-24.04${{ inputs.arch == 'arm64' && '-arm' || '' }}
        container:
            image: ghcr.io/static-php/${{ inputs.format == 'rpm' && 'packages-builder-rhel-8' || 'packages-packager-debian' }}@sha256:${{ inputs.package-image-digest }}
        steps: &publish-steps
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Select supported Python
                run: |
                    if command -v python3.9 >/dev/null 2>&1; then
                        mkdir -p "$RUNNER_TEMP/spp-python"
                        ln -sf "$(command -v python3.9)" "$RUNNER_TEMP/spp-python/python3"
                        echo "$RUNNER_TEMP/spp-python" >> "$GITHUB_PATH"
                    fi
            -   name: Set up SSH key
                if: env.TYPE == 'rpm'
                uses: webfactory/ssh-agent@d4b9b8ff72958532804b70bbe600ad43b36d5f2e # v0.8.0
                with:
                    ssh-private-key: ${{ secrets.GITHUBRPMHENDERKESPRIVATEKEY }}
            -   name: Trust repository host
                if: env.TYPE == 'rpm'
                run: |
                    host=${RPM_HOST#*@}
                    mkdir -p ~/.ssh
                    cat >> ~/.ssh/known_hosts <<EOF
                    $host ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPQq0y77dDEtxECVMhCxjcqiV369goMcbInsY/d+F1yXGwqOXQ6RqIEzgaVhgq0joMJT5BiGXNXQ+OI10/KtzGI=
                    $host ssh-rsa 
                    $host ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICaB5IjokRHAH0Y9pzVe/Jx3s6cn0OADJ9uTxQQubBMu
                    EOF
                    chmod 600 ~/.ssh/known_hosts
            -   name: Set canonical RPM repository paths
                if: env.TYPE == 'rpm'
                run: |
                    arch="$MATRIX_ARCH"
                    if [[ "$arch" == arm64 ]]; then arch=aarch64; fi
                    echo "RPM_DIRECTORY=/mnt/data/rpm/$arch/el8" >> "$GITHUB_ENV"
            -   name: Pull pinned Alpine builder
                if: env.TYPE == 'apk'
                env:
                    ACTOR: ${{ github.actor }}
                run: |
                    echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
                    docker pull "$IMAGE"
            -   name: Download complete staged cohort
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    github-token: ${{ github.token }}
                    run-id: ${{ inputs.build-run-id || github.run_id }}
                    artifact-ids: ${{ inputs.artifact-ids }}
                    pattern: ${{ inputs.artifact-ids == '' && format('shared-*-{0}-{1}*', env.TYPE, env.TARGET) || '' }}
                    path: cohort
            -   name: Verify selected build target
                run: python3 .github/actions/shared-libraries/publication.py verify-target --directory "cohort/shared-libs-$TYPE-$TARGET"
            -   name: Assemble cohort packages
                run: bash .github/actions/shared-libraries/run.sh assemble
            -   name: Verify native ordinary upgrade receipts
                run: python3 .github/actions/shared-libraries/workflow.py verify-upgrades --source cohort --library-artifact "cohort/shared-libs-$TYPE-$TARGET" --type "$TYPE"
            -   name: Sign RPM packages
                if: env.TYPE == 'rpm'
                env:
                    RPM_SIGNING_KEY: ${{ secrets.DEB_GPG_PRIVATE_KEY }}
                    RPM_SIGNING_PASSWORD: ${{ secrets.DEB_GPG_PASSWORD }}
                run: bash .github/actions/shared-libraries/sign-rpm.sh
            -   name: Verify complete cohort and all upgrade guards
                id: cohort-guard
                run: bash .github/actions/shared-libraries/run.sh publish
            -   name: Publish cohort to first existing registry
                id: registry-1
                if: env.TYPE != 'rpm'
                continue-on-error: true
                run: bash .github/actions/shared-libraries/run.sh upload-1
            -   name: Publish cohort to second existing registry
                id: registry-2
                continue-on-error: true
                if: ${{ !cancelled() && env.TYPE != 'rpm' && steps.cohort-guard.outcome == 'success' }}
                run: bash .github/actions/shared-libraries/run.sh upload-2
            -   name: Stage and promote canonical RPM generation
                if: env.TYPE == 'rpm'
                run: bash .github/actions/shared-libraries/run.sh publish-rpm
            -   name: Report registry publication failures
                if: ${{ !cancelled() && (steps.registry-1.outcome == 'failure' || steps.registry-2.outcome == 'failure') }}
                run: exit 1

    publish-apk:
        name: Publish Alpine cohort
        if: inputs.format == 'apk'
        runs-on: ubuntu-24.04${{ inputs.arch == 'arm64' && '-arm' || '' }}
        steps: *publish-steps
