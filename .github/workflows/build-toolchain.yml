name: Build toolchain blobs

# Builds the GCC toolchain from source into /opt/gcc (TOOLCHAIN_URL= forces the Dockerfiles'
# source path) and publishes /opt/gcc as a release asset per (family, arch).
# The blob is built on el8 for glibc and Alpine for musl; the Dockerfiles fetch it by default.
# Dispatch with a new gcc_version when GCC releases, then bump GCC_VERSION's default in
# the Dockerfiles (release tag and asset names all derive from the version).

on:
    workflow_dispatch:
        inputs:
            gcc_version:
                description: "GCC version to build (defines the release tag and asset names)"
                required: false
                default: "16.2.0"

permissions:
    contents: read

jobs:
    build-toolchain:
        name: Build toolchain (${{ matrix.family.name }} ${{ matrix.platform.arch }})
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                family:
                    -   name: rhel
                        dockerfile: Dockerfile.rhel
                        build-args: "ALMA_VERSION=8"
                    -   name: alpine
                        dockerfile: Dockerfile.alpine
                        build-args: ""
                platform:
                    -   arch: x86_64
                        runs-on: ubuntu-24.04
                    -   arch: aarch64
                        runs-on: ubuntu-24.04-arm
        runs-on: ${{ matrix.platform.runs-on }}
        steps:
            -   name: Checkout
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false

            -   name: Build image with toolchain from source
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GCC_VERSION: ${{ inputs.gcc_version }}
                run: |
                    printf '%s' "$GH_TOKEN" > /tmp/github_token
                    docker build -f ${{ matrix.family.dockerfile }} \
                        --build-arg TOOLCHAIN_URL= \
                        --build-arg GCC_VERSION="$GCC_VERSION" \
                        ${{ matrix.family.build-args != '' && format('--build-arg {0}', matrix.family.build-args) || '' }} \
                        --secret id=github_token,src=/tmp/github_token \
                        -t toolchain-build .
                    rm -f /tmp/github_token

            -   name: Verify runtime debug information and licenses
                env:
                    GCC_VERSION: ${{ inputs.gcc_version }}
                run: |
                    docker run --rm --env GCC_VERSION="$GCC_VERSION" toolchain-build \
                        /usr/local/bin/build-gcc-runtime --check

            -   name: Extract toolchain blob
                env:
                    GCC_VERSION: ${{ inputs.gcc_version }}
                run: |
                    set -euo pipefail
                    BLOB="gcc-${GCC_VERSION}-${{ matrix.family.name }}-${{ matrix.platform.arch }}.tar.zst"
                    docker run --rm toolchain-build tar -C / -cf - opt/gcc \
                        | zstd -12 -T0 -o "$BLOB"
                    ls -la "$BLOB"

            -   name: Upload to release
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GCC_VERSION: ${{ inputs.gcc_version }}
                run: |
                    RELEASE_TAG="toolchain-gcc-${GCC_VERSION}"
                    BLOB="gcc-${GCC_VERSION}-${{ matrix.family.name }}-${{ matrix.platform.arch }}.tar.zst"
                    gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
                        gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest=false \
                            --title "Toolchain: GCC ${GCC_VERSION}" \
                            --notes "Prebuilt native GCC toolchains with runtime DWARF and GCC runtime licenses."
                    gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$BLOB"
