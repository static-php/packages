name: Packaging code checks

on:
    push:
        branches: [master]
        paths: ['bin/**', 'src/**', 'tests/**', 'config/**', 'composer.*', '.github/actions/**', '.github/workflows/**']
    pull_request:
        paths: ['bin/**', 'src/**', 'tests/**', 'config/**', 'composer.*', '.github/actions/**', '.github/workflows/**']
    workflow_dispatch:

permissions:
    contents: read
    packages: read

jobs:
    check:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   image: ghcr.io/static-php/packages-builder-rhel-8
                        formats: rpm,deb
                    -   image: ghcr.io/static-php/packages-builder-alpine
                        formats: apk
        steps:
            -   uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Authenticate builder pull
                env:
                    GH_TOKEN: ${{ github.token }}
                run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            -   name: Check packaging code in native builders
                env:
                    IMAGE: ${{ matrix.image }}
                    FORMATS: ${{ matrix.formats }}
                run: |
                    docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build -e FORMATS "$IMAGE" bash -c '
                        set -euo pipefail
                        if command -v python3.9 >/dev/null; then
                            mkdir -p /tmp/python-bin
                            ln -s "$(command -v python3.9)" /tmp/python-bin/python3
                            export PATH=/tmp/python-bin:$PATH
                        fi
                        git config --global --add safe.directory /build
                        composer install --no-interaction --prefer-dist --no-progress
                        php tests/builder-tool-cache.php
                        php tests/attr-install.php
                        php tests/build-payload.php
                        php tests/partial-consumer-preservation.php
                        python3 tests/glibc-pipeline.py \
                            Pipeline.test_sdk_classification_needs_no_temporary_craft_and_scans_consumers_only_after_rebuild \
                            Pipeline.test_publication_rechecks_the_recorded_library_baseline_scope \
                            Pipeline.test_publication_guard_accepts_recorded_scope_and_rejects_real_changes
                        php tests/package-iterations.php
                        php tests/library-iterations.php
                        php tests/frankenphp-migration-iterations.php
                        python3 tests/apk-reuse-published.py
                        for format in ${FORMATS//,/ }; do
                            php tests/abi-consumer-revisions.php --type="$format"
                            php tests/package-versions.php --type="$format"
                        done
                        python3 tests/payload-profile.py
                        python3 tests/payload-cache.py
                        python3 tests/repackage-glibc.py
                        python3 tests/openssl-variants.py
                        python3 tests/pinned-library-sources.py
                        python3 tests/incremental-library-builds.py
                        python3 tests/spc-library-transition.py
                        python3 tests/upgrade-guards.py
                        python3 tests/migration-upgrade-harness.py
                        python3 tests/migration-baseline.py
                        python3 tests/forgejo-publication.py
                        python3 tests/library-sonames.py
                        python3 tests/shared-library-plan.py
                        python3 tests/source-state.py
                        python3 tests/source-plan-identities.py
                        python3 tests/publication-baselines.py
                        python3 tests/publication-retry-plan.py
                    '
