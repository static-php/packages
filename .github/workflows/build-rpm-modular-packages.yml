name: Build shared EL8 payloads

on:
    workflow_dispatch:
        inputs:
            formats:
                description: "Package formats to validate and publish"
                type: choice
                options: ["rpm,deb", "rpm", "deb"]
                default: "rpm,deb"
            mode:
                description: "Full manual build or incremental source build plan"
                type: choice
                options: [full, incremental]
                default: full
            libraries:
                description: "Optional: shared library IDs (comma-separated)"
                default: ""
            downloads_run_id:
                description: "Optional: pin the spc-download source snapshot"
                default: ""
            repackage_run_id:
                description: "Optional: repackage recorded sealed outputs from this build run without compilation"
                type: string
                default: ""
            builder_digest:
                description: "Optional: pin the EL8 builder image (sha256:...)"
                default: ""
            iteration:
                description: "Optional: override package iteration"
                default: ""
            bump:
                description: "Bump package revisions above published packages"
                type: boolean
                default: false
            php_versions:
                description: "Optional: PHP streams (comma-separated); ABI transitions include all affected streams"
                default: ""
            architectures:
                description: "Optional: architectures (comma-separated)"
                default: ""
            packages:
                description: "Optional: PHP package selection"
                default: ""
            publish:
                description: "Publish verified packages (false builds and tests only)"
                type: boolean
                default: false
            debug_tmate:
                description: "Open tmate on failure"
                type: boolean
                default: false
    workflow_call:
        inputs:
            formats:
                type: string
                required: false
                default: "rpm,deb"
            mode:
                type: string
                required: false
                default: "full"
            libraries:
                type: string
                required: false
                default: ""
            downloads_run_id:
                type: string
                required: false
                default: ""
            repackage_run_id:
                type: string
                required: false
                default: ""
            builder_digest:
                type: string
                required: false
                default: ""
            iteration:
                type: string
                required: false
                default: ""
            bump:
                type: boolean
                required: false
                default: false
            publish:
                type: boolean
                required: false
                default: false
            php_versions:
                type: string
                required: false
                default: ""
            architectures:
                type: string
                required: false
                default: ""
            packages:
                type: string
                required: false
                default: ""
            debug_tmate:
                type: boolean
                required: false
                default: false

permissions:
    contents: read
    packages: read

concurrency:
    group: ${{ inputs.publish == true && 'shared-packages-glibc' || format('shared-packages-glibc-test-{0}', github.run_id) }}
    cancel-in-progress: false
    queue: max

jobs:
    setup-matrix:
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
            packages: read
        outputs:
            downloads-run-id: ${{ steps.source.outputs.run-id }}
            matrix: ${{ steps.source.outputs.matrix || steps.matrix.outputs.matrix }}
            php-versions: ${{ steps.source.outputs.php-versions || steps.matrix.outputs.php-versions }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Resolve one source snapshot for the entire build
                id: source
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    REQUESTED_RUN_ID: ${{ inputs.downloads_run_id }}
                    REPACKAGE_RUN_ID: ${{ inputs.repackage_run_id }}
                    ARCHITECTURES: ${{ inputs.architectures }}
                    PHP_VERSIONS: ${{ inputs.php_versions }}
                    LIBRARIES: ${{ inputs.libraries }}
                    PACKAGES: ${{ inputs.packages }}
                    BUILDER_DIGEST: ${{ inputs.builder_digest }}
                    DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                run: |
                    set -euo pipefail
                    if [[ -n "$REPACKAGE_RUN_ID" ]]; then
                        if [[ -n "$REQUESTED_RUN_ID$LIBRARIES$PACKAGES$BUILDER_DIGEST" ]]; then
                            echo '::error::Retained binaries select their recorded sources and images; package and library filters are not supported'
                            exit 1
                        fi
                        python3 .github/actions/shared-libraries/repackage.py inspect --run-id "$REPACKAGE_RUN_ID" \
                            --architectures "$ARCHITECTURES" --php-versions "$PHP_VERSIONS" >> "$GITHUB_OUTPUT"
                        exit 0
                    fi
                    source_run="$REQUESTED_RUN_ID"
                    if [[ -z "$source_run" ]]; then
                        runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/spc-download.yml/runs?status=success&per_page=100" --paginate --jq '.workflow_runs[].id')
                        for candidate in $runs; do
                            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --paginate --jq '.artifacts[] | select(.name == "downloads-tarball" and .expired == false) | .id')
                            if [[ -n "$available" ]]; then
                                source_run="$candidate"
                                break
                            fi
                        done
                    fi
                    if [[ ! "$source_run" =~ ^[0-9]+$ ]]; then
                        echo '::error::No available spc-download source snapshot'
                        exit 1
                    fi
                    echo "run-id=$source_run" >> "$GITHUB_OUTPUT"
            -   name: Log in to builder registry
                if: inputs.repackage_run_id == ''
                env:
                    REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    ACTOR: ${{ github.actor }}
                run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            -   name: Set target matrix and pin shared images
                if: inputs.repackage_run_id == ''
                id: matrix
                env:
                    ARCHITECTURES: ${{ inputs.architectures }}
                    ALMA_VERSIONS: "8"
                    PHP_VERSIONS: ${{ inputs.php_versions }}
                    BUILDER_DIGEST: ${{ inputs.builder_digest }}
                run: |
                    python3 .github/actions/shared-libraries/workflow.py setup --type=glibc \
                        --architectures "$ARCHITECTURES" --alma-versions "$ALMA_VERSIONS" \
                        --php-versions "$PHP_VERSIONS" --builder-digest "$BUILDER_DIGEST" --resolve-images >> "$GITHUB_OUTPUT"

    build-libs:
        name: ${{ inputs.repackage_run_id != '' && 'Repackage libraries' || 'Build libs shared' }} (${{ matrix.target }})
        needs: setup-matrix
        runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
        container:
            image: ${{ matrix.image }}
        permissions:
            contents: write
            packages: read
            actions: read
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
        env:
            IMAGE: ${{ matrix.image }}
            SOURCE_RUN_ID: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            TYPE: rpm
            PACKAGE_IMAGES: ${{ toJson(matrix.package_images) }}
            TARGET: ${{ matrix.target }}
            MATRIX_ARCH: ${{ matrix.arch }}
            MODE: ${{ inputs.mode || 'full' }}
            LIBRARIES: ${{ inputs.libraries || '' }}
            PHP_VERSIONS: ${{ inputs.php_versions || '' }}
            PACKAGES: ${{ matrix.packages || inputs.packages || '' }}
            PHPV: ${{ matrix.php-version || '' }}
            ITERATION: ${{ inputs.iteration || '' }}
            BUMP: ${{ inputs.bump || false }}
            PUBLISH: ${{ inputs.publish || false }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            FORGEJO_PASSWORD: ${{ secrets.FORGEJO_PASSWORD }}
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
            RPM_HOST: github@${{ secrets.DEB_SERVER_IP }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Select supported Python
                run: |
                    if command -v python3.9 >/dev/null 2>&1; then
                        mkdir -p "$RUNNER_TEMP/spp-python"
                        ln -sf "$(command -v python3.9)" "$RUNNER_TEMP/spp-python/python3"
                        echo "$RUNNER_TEMP/spp-python" >> "$GITHUB_PATH"
                    fi
            -   name: Download pinned source snapshot
                if: inputs.repackage_run_id == ''
                run: |
                    python3 .github/actions/shared-libraries/source-snapshot.py fetch
                    python3 .github/actions/shared-libraries/workflow.py validate-source --mode "$MODE"
            -   name: Prepare Composer cache
                run: mkdir -p ~/.cache/composer
            -   name: Restore Composer downloads
                id: composer-cache
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-
            -   name: Compute source and toolchain fingerprint
                if: inputs.repackage_run_id == ''
                id: fingerprint
                run: bash .github/actions/shared-libraries/run.sh fingerprint >> "$GITHUB_OUTPUT"
            -   name: Compute buildroot cache key
                if: inputs.repackage_run_id == ''
                id: cache-key
                env:
                    FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
                    COMPATIBILITY: ${{ steps.fingerprint.outputs.compatibility }}
                run: |
                    echo "key=buildroot-shared-glibc-$TARGET-$FINGERPRINT" >> "$GITHUB_OUTPUT"
                    echo "seed-key=buildroot-shared-seed-glibc-$TARGET-$COMPATIBILITY" >> "$GITHUB_OUTPUT"
            -   name: Restore buildroot cache
                if: inputs.repackage_run_id == ''
                id: cache
                uses: ./.github/actions/buildroot-cache
                with:
                    mode: restore
                    key: ${{ steps.cache-key.outputs.key }}
                    seed-key: ${{ steps.cache-key.outputs.seed-key }}
            -   name: Extract restored buildroot
                if: steps.cache.outputs.cache-hit == 'true' || steps.cache.outputs.seed-hit == 'true'
                run: zstd -dc buildroot.tar.zst | tar -xf -
            -   name: Build changed shared libraries
                if: inputs.repackage_run_id == ''
                run: bash .github/actions/shared-libraries/run.sh libs
            -   name: Download retained library SDK
                if: inputs.repackage_run_id != '' && matrix.repackage_sdk_artifact != ''
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    github-token: ${{ github.token }}
                    run-id: ${{ inputs.repackage_run_id }}
                    artifact-ids: ${{ matrix.repackage_sdk_artifact }}
                    merge-multiple: true
            -   name: Download retained SDK metadata
                if: inputs.repackage_run_id != ''
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    github-token: ${{ github.token }}
                    run-id: ${{ inputs.repackage_run_id }}
                    artifact-ids: ${{ matrix.repackage_metadata_artifact }}
                    merge-multiple: true
                    path: stage/common
            -   name: Repackage retained library binaries
                if: inputs.repackage_run_id != ''
                env:
                    REPACKAGE_RUN_ID: ${{ inputs.repackage_run_id }}
                    REPACKAGE_PAYLOAD_ARTIFACTS: ${{ toJson(matrix.repackage_payload_artifacts) }}
                    CACHE_KEY: repackage-${{ inputs.repackage_run_id }}-${{ matrix.target }}
                run: |
                    if [[ -f buildroot.tar.zst ]]; then
                        zstd -dc buildroot.tar.zst | tar -xf -
                        composer install --no-interaction --prefer-dist --no-progress
                    fi
                    python3 .github/actions/shared-libraries/repackage.py libraries
            -   name: Classify ABI and package shared libraries
                id: classification
                run: |
                    if [[ -z "$REPACKAGE_RUN_ID" ]]; then
                        bash .github/actions/shared-libraries/run.sh glibc-classify
                    fi
                    echo "libraries-required=$(jq '(.libraries | length) > 0' stage/common/shared-library-plan.json)" >> "$GITHUB_OUTPUT"
                    echo "php-required=$(jq 'any(.php_requests[]; .full or (.packages | length > 0))' stage/common/shared-library-plan.json)" >> "$GITHUB_OUTPUT"
                    if [[ -z "$REPACKAGE_RUN_ID" ]]; then
                        python3 .github/actions/shared-libraries/workflow.py inline --plan stage/common/shared-library-plan.json >> "$GITHUB_OUTPUT"
                    fi
                env:
                    REPACKAGE_RUN_ID: ${{ inputs.repackage_run_id }}
            -   name: Build single PHP stream in the restored SDK workspace
                if: steps.classification.outputs.inline-stream != ''
                uses: ./.github/actions/php-payload
                env:
                    PHPV: ${{ steps.classification.outputs.inline-stream }}
                    PACKAGES: ${{ fromJson(steps.classification.outputs.inline-request || '{}').packages }}
                    COMPILE: ${{ fromJson(steps.classification.outputs.inline-request || '{}').compile }}
                    COMPILE_PACKAGES: ${{ fromJson(steps.classification.outputs.inline-request || '{}').compile-packages }}
                    ABI_REBUILD_LIBRARIES: ${{ fromJson(steps.classification.outputs.inline-request || '{}').abi-rebuild-libraries }}
                    ABI_BREAK: ${{ fromJson(steps.classification.outputs.inline-request || '{}').abi-break }}
                    ABI_CORE_REBUILD: ${{ fromJson(steps.classification.outputs.inline-request || '{}').abi-core-rebuild }}
            -   name: Pack buildroot
                if: inputs.repackage_run_id == '' && (hashFiles('buildroot.tar.zst') == '' || hashFiles('stage/sdk-rebuilt') != '') && (inputs.publish == true || steps.classification.outputs.libraries-required == 'true' || (steps.classification.outputs.php-required == 'true' && steps.classification.outputs.inline-stream == ''))
                run: tar -cf - buildroot | zstd -f -o buildroot.tar.zst
            -   name: Save buildroot cache
                if: inputs.repackage_run_id == '' && inputs.publish == true && (steps.cache.outputs.cache-current != 'true' || hashFiles('stage/sdk-rebuilt') != '')
                uses: ./.github/actions/buildroot-cache
                with:
                    mode: save
                    key: ${{ steps.cache-key.outputs.key }}
                    seed-key: ${{ steps.cache-key.outputs.seed-key }}
            -   name: Record target and buildroot
                if: inputs.repackage_run_id == ''
                env:
                    CACHE_KEY: ${{ steps.cache-key.outputs.key }}
                    ALMA: ${{ matrix.alma }}
                run: bash .github/actions/shared-libraries/run.sh glibc-record
            -   name: Stage target plan
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-plans-glibc-${{ matrix.target }}
                    path: |
                        stage/common/shared-library-plan.json
                        stage/common/target.json
                    retention-days: 7
            -   name: Stage common SDK metadata
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-sdk-glibc-${{ matrix.target }}
                    path: stage/common
                    retention-days: 1
            -   name: Stage common SDK buildroot
                if: steps.classification.outputs.libraries-required == 'true' || (inputs.repackage_run_id == '' && steps.classification.outputs.php-required == 'true' && steps.classification.outputs.inline-stream == '')
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-sdk-buildroot-glibc-${{ matrix.target }}
                    path: buildroot.tar.zst
                    compression-level: 0
                    retention-days: 1
            -   name: Upload logs on failure
                if: ${{ failure() }}
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: logs-libs-rpm-${{ matrix.target }}
                    path: log
            -   name: Install tmate on failure
                if: ${{ failure() && inputs.debug_tmate == true }}
                run: |
                    arch=amd64
                    if [[ "$MATRIX_ARCH" == arm64 ]]; then arch=arm64v8; fi
                    directory="tmate-2.4.0-static-linux-$arch"
                    curl -fsSL "https://github.com/tmate-io/tmate/releases/download/2.4.0/$directory.tar.xz" | tar -xJ -O "$directory/tmate" > /usr/bin/tmate
                    chmod +x /usr/bin/tmate
            -   name: Debug build failure
                if: ${{ failure() && inputs.debug_tmate == true }}
                uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3
                timeout-minutes: 30
                with:
                    install-dependencies: false
                    sudo: false
            -   name: Save Composer downloads
                if: inputs.publish == true && steps.composer-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: ${{ steps.composer-cache.outputs.cache-primary-key }}

    compute-build-matrix:
        needs: [setup-matrix, build-libs]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
        outputs:
            matrix: ${{ steps.filter.outputs.matrix }}
            any: ${{ steps.filter.outputs.any }}
            publish-any: ${{ steps.filter.outputs.publish-any }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Download target plans
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                continue-on-error: true
                with:
                    pattern: shared-plans-glibc-*
                    path: plans
            -   name: Filter successful targets and select PHP consumers
                id: filter
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    PHP_VERSIONS: ${{ inputs.php_versions }}
                    FORMATS: ${{ inputs.formats || 'rpm,deb' }}
                run: |
                    set -euo pipefail
                    succeeded=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
                        --jq '.jobs[] | select(.conclusion == "success") | .name | split(" / ") | last | select(test("^(Build libs shared|Repackage libraries) \\("))' \
                        | sed -E 's/^(Build libs shared|Repackage libraries) \(([^)]+)\)$/\2/' | sort -u)
                    python3 .github/actions/shared-libraries/workflow.py matrix --plans plans \
                        --php-versions "$PHP_VERSIONS" --formats "$FORMATS" --succeeded "$succeeded" >> "$GITHUB_OUTPUT"

    build-payload:
        name: ${{ inputs.repackage_run_id != '' && 'Reuse payload' || 'Build payload' }} (${{ matrix.target }} php${{ matrix.php-version }})
        needs: [setup-matrix, compute-build-matrix]
        if: ${{ !cancelled() && needs.compute-build-matrix.outputs.any == 'true' }}
        runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
        container:
            image: ${{ matrix.image }}
        permissions:
            contents: write
            packages: read
            actions: read
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.compute-build-matrix.outputs.matrix) }}
        env:
            IMAGE: ${{ matrix.image }}
            SOURCE_RUN_ID: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            TYPE: rpm
            TARGET: ${{ matrix.target }}
            MATRIX_ARCH: ${{ matrix.arch }}
            MODE: ${{ inputs.mode || 'full' }}
            LIBRARIES: ${{ inputs.libraries || '' }}
            PHP_VERSIONS: ${{ inputs.php_versions || '' }}
            PACKAGES: ${{ matrix.packages }}
            COMPILE: ${{ matrix.compile }}
            COMPILE_PACKAGES: ${{ matrix.compile-packages }}
            ABI_REBUILD_LIBRARIES: ${{ matrix.abi-rebuild-libraries }}
            ABI_BREAK: ${{ matrix.abi-break }}
            ABI_CORE_REBUILD: ${{ matrix.abi-core-rebuild }}
            PHPV: ${{ matrix.php-version || '' }}
            ITERATION: ${{ inputs.iteration || '' }}
            BUMP: ${{ inputs.bump || false }}
            PUBLISH: ${{ inputs.publish || false }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            FORGEJO_PASSWORD: ${{ secrets.FORGEJO_PASSWORD }}
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
            RPM_HOST: github@${{ secrets.DEB_SERVER_IP }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Select supported Python
                run: |
                    if command -v python3.9 >/dev/null 2>&1; then
                        mkdir -p "$RUNNER_TEMP/spp-python"
                        ln -sf "$(command -v python3.9)" "$RUNNER_TEMP/spp-python/python3"
                        echo "$RUNNER_TEMP/spp-python" >> "$GITHUB_PATH"
                    fi
            -   name: Download pinned source snapshot
                if: inputs.repackage_run_id == ''
                run: |
                    python3 .github/actions/shared-libraries/source-snapshot.py fetch
                    python3 .github/actions/shared-libraries/workflow.py validate-source --mode "$MODE"
            -   name: Download shared library packages and plan
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    name: shared-sdk-glibc-${{ matrix.target }}
                    path: stage
            -   name: Download exact common SDK
                if: inputs.repackage_run_id == ''
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    name: shared-sdk-buildroot-glibc-${{ matrix.target }}
            -   name: Extract buildroot
                if: inputs.repackage_run_id == ''
                run: zstd -dc buildroot.tar.zst | tar -xf -
            -   name: Prepare Composer cache
                run: mkdir -p ~/.cache/composer
            -   name: Restore Composer downloads
                id: composer-cache
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-
            -   name: Build and stage common PHP payload
                if: inputs.repackage_run_id == ''
                uses: ./.github/actions/php-payload
            -   name: Download retained sealed PHP payload
                if: inputs.repackage_run_id != ''
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    github-token: ${{ github.token }}
                    run-id: ${{ inputs.repackage_run_id }}
                    artifact-ids: ${{ matrix.repackage_payload_artifacts[matrix.php-version] }}
                    merge-multiple: true
            -   name: Verify and stage retained PHP bytes
                if: inputs.repackage_run_id != ''
                run: |
                    zstd -dc php-payload.tar.zst | tar -xpf -
                    composer install --no-interaction --prefer-dist --no-progress
                    python3 .github/actions/shared-libraries/repackage.py payload
                    python3 .github/actions/shared-libraries/payload-cache.py package-archive --payload "build/$PHPV" --output php-payload-repackaged.tar.zst
                    mv php-payload-repackaged.tar.zst php-payload.tar.zst
            -   name: Stage reused common PHP payload
                if: inputs.repackage_run_id != ''
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: shared-payload-glibc-${{ env.TARGET }}-php${{ env.PHPV }}
                    path: php-payload.tar.zst
                    compression-level: 0
                    retention-days: 1
            -   name: Report skipped shared extensions
                if: ${{ !cancelled() }}
                env:
                    PHPV: ${{ matrix.php-version }}
                run: |
                    for manifest in "build/$PHPV/skipped-shared-extensions.json" buildroot/skipped-shared-extensions.json; do
                        if [[ -f "$manifest" ]]; then
                            jq -r --arg target "$TARGET php$PHPV" '.skipped[]? | "::warning::\($target): skipped \(.extension) (\(.phase)): \(.message)"' "$manifest"
                            jq -r --arg target "$TARGET php$PHPV" '.skipped[]? | "- \($target): \(.extension) (\(.phase)): \(.message | gsub("[\r\n]"; " "))"' "$manifest" >> "$GITHUB_STEP_SUMMARY"
                            break
                        fi
                    done
            -   name: Upload logs on failure
                if: ${{ failure() }}
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: logs-php-rpm-${{ matrix.target }}-${{ matrix.php-version }}
                    path: log
            -   name: Install tmate on failure
                if: ${{ failure() && inputs.debug_tmate == true }}
                run: |
                    arch=amd64
                    if [[ "$MATRIX_ARCH" == arm64 ]]; then arch=arm64v8; fi
                    directory="tmate-2.4.0-static-linux-$arch"
                    curl -fsSL "https://github.com/tmate-io/tmate/releases/download/2.4.0/$directory.tar.xz" | tar -xJ -O "$directory/tmate" > /usr/bin/tmate
                    chmod +x /usr/bin/tmate
            -   name: Debug build failure
                if: ${{ failure() && inputs.debug_tmate == true }}
                uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3
                timeout-minutes: 30
                with:
                    install-dependencies: false
                    sudo: false
            -   name: Save Composer downloads
                if: inputs.publish == true && steps.composer-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: ${{ steps.composer-cache.outputs.cache-primary-key }}

    package-formats:
        name: Queue independent format runs
        needs: [setup-matrix, build-libs, compute-build-matrix, build-payload]
        if: ${{ !cancelled() && needs.compute-build-matrix.outputs.publish-any == 'true' }}
        runs-on: ubuntu-24.04
        permissions:
            actions: write
            contents: read
        steps:
            -   name: Start RPM and DEB packaging independently
                env:
                    GH_TOKEN: ${{ github.token }}
                    FORMATS: ${{ inputs.formats || 'rpm,deb' }}
                    MODE: ${{ inputs.mode || 'full' }}
                    PHP_VERSIONS: ${{ inputs.php_versions }}
                    ITERATION: ${{ inputs.iteration }}
                    BUMP: ${{ inputs.bump || false }}
                    PUBLISH: ${{ inputs.publish || false }}
                run: |
                    IFS=, read -ra formats <<< "$FORMATS"
                    for format in "${formats[@]}"; do
                        gh workflow run package-glibc.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
                            -f format="$format" -f build_run_id="$GITHUB_RUN_ID" -f mode="$MODE" \
                            -f php_versions="$PHP_VERSIONS" -f iteration="$ITERATION" -f bump="$BUMP" -f publish="$PUBLISH"
                    done
