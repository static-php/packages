name: Build shared EL8 RPM and DEB packages

on:
    workflow_dispatch:
        inputs:
            mode:
                description: "Full manual build or incremental source build plan"
                type: choice
                options: [full, incremental]
                default: full
            libraries:
                description: "Optional: shared library IDs (comma-separated)"
                default: ""
            downloads_run_id:
                description: "Optional: pin the spc-download source snapshot"
                default: ""
            iteration:
                description: "Optional: override package iteration"
                default: ""
            bump:
                description: "Bump package revisions above published packages"
                type: boolean
                default: false
            php_versions:
                description: "Optional: PHP streams (comma-separated); ABI transitions include all affected streams"
                default: ""
            architectures:
                description: "Optional: architectures (comma-separated)"
                default: ""
            packages:
                description: "Optional: PHP package selection"
                default: ""
            publish:
                description: "Publish verified packages (false builds and tests only)"
                type: boolean
                default: false
            debug_tmate:
                description: "Open tmate on failure"
                type: boolean
                default: false
    workflow_call:
        inputs:
            mode:
                type: string
                required: false
                default: "full"
            libraries:
                type: string
                required: false
                default: ""
            downloads_run_id:
                type: string
                required: false
                default: ""
            iteration:
                type: string
                required: false
                default: ""
            bump:
                type: boolean
                required: false
                default: false
            publish:
                type: boolean
                required: false
                default: false
            php_versions:
                type: string
                required: false
                default: ""
            architectures:
                type: string
                required: false
                default: ""
            packages:
                type: string
                required: false
                default: ""
            debug_tmate:
                type: boolean
                required: false
                default: false

permissions:
    contents: read
    packages: read

concurrency:
    group: shared-packages-glibc
    cancel-in-progress: false

jobs:
    setup-matrix:
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
        outputs:
            downloads-run-id: ${{ steps.source.outputs.run-id }}
            matrix: ${{ steps.matrix.outputs.matrix }}
            php-versions: ${{ steps.matrix.outputs.php-versions }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Resolve one source snapshot for the entire build
                id: source
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    REQUESTED_RUN_ID: ${{ inputs.downloads_run_id }}
                run: |
                    set -euo pipefail
                    source_run="$REQUESTED_RUN_ID"
                    if [[ -z "$source_run" ]]; then
                        runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/spc-download.yml/runs?status=success&per_page=100" --paginate --jq '.workflow_runs[].id')
                        for candidate in $runs; do
                            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --paginate --jq '.artifacts[] | select(.name == "downloads-tarball" and .expired == false) | .id')
                            if [[ -n "$available" ]]; then
                                source_run="$candidate"
                                break
                            fi
                        done
                    fi
                    if [[ ! "$source_run" =~ ^[0-9]+$ ]]; then
                        echo '::error::No available spc-download source snapshot'
                        exit 1
                    fi
                    echo "run-id=$source_run" >> "$GITHUB_OUTPUT"
            -   name: Set target matrix
                id: matrix
                env:
                    ARCHITECTURES: ${{ inputs.architectures }}
                    ALMA_VERSIONS: "8"
                    PHP_VERSIONS: ${{ inputs.php_versions }}
                run: |
                    python3 .github/actions/shared-libraries/workflow.py setup --type=glibc \
                        --architectures "$ARCHITECTURES" --alma-versions "$ALMA_VERSIONS" \
                        --php-versions "$PHP_VERSIONS" >> "$GITHUB_OUTPUT"

    resolve-builders:
        name: Resolve builder (${{ matrix.target }})
        needs: setup-matrix
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: read
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Pin target builder image
                env:
                    REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    ACTOR: ${{ github.actor }}
                    ARCH: ${{ matrix.arch }}
                    ALMA: ${{ matrix.alma }}
                run: |
                    set -euo pipefail
                    echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
                    python3 .github/actions/shared-libraries/workflow.py setup --type=glibc \
                        --architectures "$ARCH" --alma-versions "$ALMA" --resolve-images > "$RUNNER_TEMP/builder-output"
                    sed -n 's/^matrix=//p' "$RUNNER_TEMP/builder-output" | jq '.include[0]' > target.json
            -   name: Stage pinned builder
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-builders-glibc-${{ matrix.target }}
                    path: target.json
                    retention-days: 1

    compute-libs-matrix:
        needs: [setup-matrix, resolve-builders]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            actions: read
        outputs:
            matrix: ${{ steps.filter.outputs.matrix }}
            any: ${{ steps.filter.outputs.any }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Download pinned builders
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                continue-on-error: true
                with:
                    pattern: shared-builders-glibc-*
                    path: builders
            -   name: Filter successful builder targets
                id: filter
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    set -euo pipefail
                    succeeded=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
                        --jq '.jobs[] | select(.conclusion == "success") | .name | split(" / ") | last | select(test("^Resolve builder \\("))' \
                        | sed -E 's/^Resolve builder \(([^)]+)\)$/\1/' | sort -u)
                    python3 .github/actions/shared-libraries/workflow.py targets --directory builders \
                        --succeeded "$succeeded" >> "$GITHUB_OUTPUT"

    build-libs:
        name: Build libs shared (${{ matrix.target }})
        needs: [setup-matrix, compute-libs-matrix]
        if: ${{ !cancelled() && needs.compute-libs-matrix.outputs.any == 'true' }}
        runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
        container:
            image: ${{ matrix.image }}
        permissions:
            contents: write
            packages: read
            actions: read
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.compute-libs-matrix.outputs.matrix) }}
        env:
            IMAGE: ${{ matrix.image }}
            SOURCE_RUN_ID: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            TYPE: rpm
            PACKAGE_IMAGES: ${{ toJson(matrix.package_images) }}
            TARGET: ${{ matrix.target }}
            MATRIX_ARCH: ${{ matrix.arch }}
            MODE: ${{ inputs.mode || 'full' }}
            LIBRARIES: ${{ inputs.libraries || '' }}
            PHP_VERSIONS: ${{ inputs.php_versions || '' }}
            PACKAGES: ${{ matrix.packages || inputs.packages || '' }}
            PHPV: ${{ matrix.php-version || '' }}
            ITERATION: ${{ inputs.iteration || '' }}
            BUMP: ${{ inputs.bump || false }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            FORGEJO_PASSWORD: ${{ secrets.FORGEJO_PASSWORD }}
            FORGEJO_LIBS_PASSWORD: ${{ secrets.FORGEJO_LIBS_PASSWORD }}
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
            RPM_HOST: github@${{ secrets.DEB_SERVER_IP }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Select supported Python
                run: |
                    if command -v python3.9 >/dev/null 2>&1; then
                        mkdir -p "$RUNNER_TEMP/spp-python"
                        ln -sf "$(command -v python3.9)" "$RUNNER_TEMP/spp-python/python3"
                        echo "$RUNNER_TEMP/spp-python" >> "$GITHUB_PATH"
                    fi
            -   name: Download pinned source snapshot
                uses: dawidd6/action-download-artifact@ac66b43f0e6a346234dd65d4d0c8fbb31cb316e5 # v11
                with:
                    workflow: spc-download.yml
                    name: downloads-tarball
                    search_artifacts: true
                    run_id: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            -   name: Extract source snapshot
                run: |
                    mkdir -p downloads
                    tar --no-same-owner -xzf downloads.tar.gz -C downloads
                    rm downloads.tar.gz
                    python3 .github/actions/shared-libraries/workflow.py validate-source --mode "$MODE"
            -   name: Prepare Composer cache
                run: mkdir -p ~/.cache/composer
            -   name: Restore Composer downloads
                id: composer-cache
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ hashFiles('**/composer.lock') }}
                    restore-keys: composer-
            -   name: Compute source and toolchain fingerprint
                id: fingerprint
                run: bash .github/actions/shared-libraries/run.sh fingerprint >> "$GITHUB_OUTPUT"
            -   name: Compute buildroot cache key
                id: cache-key
                env:
                    FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
                    COMPATIBILITY: ${{ steps.fingerprint.outputs.compatibility }}
                run: |
                    echo "key=buildroot-shared-glibc-$TARGET-$FINGERPRINT-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
                    echo "seed-key=buildroot-shared-seed-glibc-$TARGET-$COMPATIBILITY" >> "$GITHUB_OUTPUT"
            -   name: Restore buildroot cache
                id: cache
                uses: ./.github/actions/buildroot-cache
                with:
                    mode: restore
                    key: ${{ steps.cache-key.outputs.key }}
                    seed-key: ${{ steps.cache-key.outputs.seed-key }}
            -   name: Extract restored buildroot
                if: steps.cache.outputs.cache-hit == 'true' || steps.cache.outputs.seed-hit == 'true'
                run: zstd -dc buildroot.tar.zst | tar -xf -
            -   name: Build changed shared libraries
                run: bash .github/actions/shared-libraries/run.sh libs
            -   name: Classify ABI and package shared libraries
                run: bash .github/actions/shared-libraries/run.sh glibc-classify
            -   name: Pack buildroot
                run: tar -cf - buildroot | zstd -f -o buildroot.tar.zst
            -   name: Save buildroot cache
                if: inputs.publish == true && (steps.cache.outputs.cache-current != 'true' || hashFiles('stage/sdk-rebuilt') != '')
                uses: ./.github/actions/buildroot-cache
                with:
                    mode: save
                    key: ${{ steps.cache-key.outputs.key }}
                    seed-key: ${{ steps.cache-key.outputs.seed-key }}
            -   name: Record target and buildroot
                env:
                    CACHE_KEY: ${{ steps.cache-key.outputs.key }}
                    ALMA: ${{ matrix.alma }}
                run: bash .github/actions/shared-libraries/run.sh glibc-record
            -   name: Stage target plan
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-plans-glibc-${{ matrix.target }}
                    path: |
                        stage/common/shared-library-plan.json
                        stage/common/target.json
                    retention-days: 1
            -   name: Stage common SDK metadata
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-sdk-glibc-${{ matrix.target }}
                    path: stage/common
                    retention-days: 1
            -   name: Stage common SDK buildroot
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-sdk-buildroot-glibc-${{ matrix.target }}
                    path: buildroot.tar.zst
                    compression-level: 0
                    retention-days: 1
            -   name: Stage RPM library packages
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-libs-rpm-${{ matrix.target }}
                    path: stage/rpm
                    retention-days: 1
            -   name: Stage DEB library packages
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-libs-deb-${{ matrix.target }}
                    path: stage/deb
                    retention-days: 1
            -   name: Upload logs on failure
                if: ${{ failure() }}
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: logs-libs-rpm-${{ matrix.target }}
                    path: log
            -   name: Install tmate on failure
                if: ${{ failure() && inputs.debug_tmate == true }}
                run: |
                    arch=amd64
                    if [[ "$MATRIX_ARCH" == arm64 ]]; then arch=arm64v8; fi
                    directory="tmate-2.4.0-static-linux-$arch"
                    curl -fsSL "https://github.com/tmate-io/tmate/releases/download/2.4.0/$directory.tar.xz" | tar -xJ -O "$directory/tmate" > /usr/bin/tmate
                    chmod +x /usr/bin/tmate
            -   name: Debug build failure
                if: ${{ failure() && inputs.debug_tmate == true }}
                uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3
                timeout-minutes: 30
                with:
                    install-dependencies: false
                    sudo: false
            -   name: Save Composer downloads
                if: inputs.publish == true && steps.composer-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ hashFiles('**/composer.lock') }}

    compute-build-matrix:
        needs: [setup-matrix, build-libs]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
        outputs:
            matrix: ${{ steps.filter.outputs.matrix }}
            any: ${{ steps.filter.outputs.any }}
            publish-matrix: ${{ steps.filter.outputs.publish-matrix }}
            publish-any: ${{ steps.filter.outputs.publish-any }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Download target plans
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                continue-on-error: true
                with:
                    pattern: shared-plans-glibc-*
                    path: plans
            -   name: Filter successful targets and select PHP consumers
                id: filter
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    PHP_VERSIONS: ${{ inputs.php_versions }}
                run: |
                    set -euo pipefail
                    succeeded=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
                        --jq '.jobs[] | select(.conclusion == "success") | .name | split(" / ") | last | select(test("^Build libs shared \\("))' \
                        | sed -E 's/^Build libs shared \(([^)]+)\)$/\1/' | sort -u)
                    python3 .github/actions/shared-libraries/workflow.py matrix --plans plans \
                        --php-versions "$PHP_VERSIONS" --succeeded "$succeeded" >> "$GITHUB_OUTPUT"

    build-payload:
        name: Build payload (${{ matrix.target }} php${{ matrix.php-version }})
        needs: [setup-matrix, compute-build-matrix]
        if: ${{ !cancelled() && needs.compute-build-matrix.outputs.any == 'true' }}
        runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
        container:
            image: ${{ matrix.image }}
        permissions:
            contents: write
            packages: read
            actions: read
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.compute-build-matrix.outputs.matrix) }}
        env:
            IMAGE: ${{ matrix.image }}
            SOURCE_RUN_ID: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            TYPE: rpm
            TARGET: ${{ matrix.target }}
            MATRIX_ARCH: ${{ matrix.arch }}
            MODE: ${{ inputs.mode || 'full' }}
            LIBRARIES: ${{ inputs.libraries || '' }}
            PHP_VERSIONS: ${{ inputs.php_versions || '' }}
            PACKAGES: ${{ matrix.packages }}
            COMPILE: ${{ matrix.compile }}
            COMPILE_PACKAGES: ${{ matrix.compile-packages }}
            ABI_REBUILD_LIBRARIES: ${{ matrix.abi-rebuild-libraries }}
            PHPV: ${{ matrix.php-version || '' }}
            ITERATION: ${{ inputs.iteration || '' }}
            BUMP: ${{ inputs.bump || false }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            FORGEJO_PASSWORD: ${{ secrets.FORGEJO_PASSWORD }}
            FORGEJO_LIBS_PASSWORD: ${{ secrets.FORGEJO_LIBS_PASSWORD }}
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
            RPM_HOST: github@${{ secrets.DEB_SERVER_IP }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Select supported Python
                run: |
                    if command -v python3.9 >/dev/null 2>&1; then
                        mkdir -p "$RUNNER_TEMP/spp-python"
                        ln -sf "$(command -v python3.9)" "$RUNNER_TEMP/spp-python/python3"
                        echo "$RUNNER_TEMP/spp-python" >> "$GITHUB_PATH"
                    fi
            -   name: Download pinned source snapshot
                uses: dawidd6/action-download-artifact@ac66b43f0e6a346234dd65d4d0c8fbb31cb316e5 # v11
                with:
                    workflow: spc-download.yml
                    name: downloads-tarball
                    search_artifacts: true
                    run_id: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            -   name: Extract source snapshot
                run: |
                    mkdir -p downloads
                    tar --no-same-owner -xzf downloads.tar.gz -C downloads
                    rm downloads.tar.gz
                    python3 .github/actions/shared-libraries/workflow.py validate-source --mode "$MODE"
            -   name: Download shared library packages and plan
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    name: shared-sdk-glibc-${{ matrix.target }}
                    path: stage
            -   name: Download exact common SDK
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    name: shared-sdk-buildroot-glibc-${{ matrix.target }}
            -   name: Extract buildroot
                run: zstd -dc buildroot.tar.zst | tar -xf -
            -   name: Prepare Composer cache
                run: mkdir -p ~/.cache/composer
            -   name: Restore Composer downloads
                id: composer-cache
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ hashFiles('**/composer.lock') }}
                    restore-keys: composer-
            -   name: Compute sealed PHP cache identity
                id: payload-cache-key
                run: |
                    python3 .github/actions/shared-libraries/payload-cache.py key --root . --stream "$PHPV" --manifest buildroot/shared-libraries.json --compatibility stage/library-compatibility | tee stage/payload-cache-inputs
                    key=$(sed -n 's/^key=//p' stage/payload-cache-inputs)
                    seed=$(sed -n 's/^seed-key=//p' stage/payload-cache-inputs)
                    printf '%s\n' "$key" > stage/payload-cache-key
                    printf '%s\n' "$seed" > stage/payload-cache-seed-key
                    cat stage/payload-cache-inputs >> "$GITHUB_OUTPUT"
                    echo "cache-key=$key-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
            -   name: Restore sealed PHP payload
                id: payload-cache
                uses: ./.github/actions/buildroot-cache
                with:
                    mode: restore
                    key: ${{ steps.payload-cache-key.outputs.cache-key }}
                    seed-key: ${{ (!matrix.abi-break || (matrix.compile && !matrix.abi-core-rebuild)) && steps.payload-cache-key.outputs.seed-key || '' }}
                    path: php-payload-cache.tar.zst
            -   name: Build and seal common PHP payload
                run: bash .github/actions/shared-libraries/run.sh glibc-payload
            -   name: Export PHP-only sealed cache
                run: |
                    source_run=$(python3 -c 'import json; print(json.load(open("stage/payload-provenance.json"))["compiled_source_run_id"])')
                    python3 .github/actions/shared-libraries/payload-cache.py export --root . --payload "build/$PHPV" --compatibility stage/library-compatibility --key "$(cat stage/payload-cache-key)" --seed-key "$(cat stage/payload-cache-seed-key)" --source-run-id "$source_run" --output php-payload-cache.tar.zst
            -   name: Save sealed PHP payload cache
                if: inputs.publish == true && steps.payload-cache.outputs.cache-current != 'true'
                uses: ./.github/actions/buildroot-cache
                with:
                    mode: save
                    key: ${{ steps.payload-cache-key.outputs.cache-key }}
                    seed-key: ${{ steps.payload-cache-key.outputs.seed-key }}
                    path: php-payload-cache.tar.zst
            -   name: Report skipped shared extensions
                if: ${{ !cancelled() }}
                env:
                    PHPV: ${{ matrix.php-version }}
                run: |
                    for manifest in "build/$PHPV/skipped-shared-extensions.json" buildroot/skipped-shared-extensions.json; do
                        if [[ -f "$manifest" ]]; then
                            jq -r --arg target "$TARGET php$PHPV" '.skipped[]? | "::warning::\($target): skipped \(.extension) (\(.phase)): \(.message)"' "$manifest"
                            jq -r --arg target "$TARGET php$PHPV" '.skipped[]? | "- \($target): \(.extension) (\(.phase)): \(.message | gsub("[\r\n]"; " "))"' "$manifest" >> "$GITHUB_STEP_SUMMARY"
                            break
                        fi
                    done
            -   name: Pack sealed common payload
                run: tar -cf - "build/$PHPV" stage/payload-provenance.json | zstd -f -o php-payload.tar.zst
            -   name: Stage sealed common payload
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: shared-payload-glibc-${{ matrix.target }}-php${{ matrix.php-version }}
                    path: php-payload.tar.zst
                    compression-level: 0
                    retention-days: 1
            -   name: Upload logs on failure
                if: ${{ failure() }}
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: logs-php-rpm-${{ matrix.target }}-${{ matrix.php-version }}
                    path: log
            -   name: Install tmate on failure
                if: ${{ failure() && inputs.debug_tmate == true }}
                run: |
                    arch=amd64
                    if [[ "$MATRIX_ARCH" == arm64 ]]; then arch=arm64v8; fi
                    directory="tmate-2.4.0-static-linux-$arch"
                    curl -fsSL "https://github.com/tmate-io/tmate/releases/download/2.4.0/$directory.tar.xz" | tar -xJ -O "$directory/tmate" > /usr/bin/tmate
                    chmod +x /usr/bin/tmate
            -   name: Debug build failure
                if: ${{ failure() && inputs.debug_tmate == true }}
                uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3
                timeout-minutes: 30
                with:
                    install-dependencies: false
                    sudo: false
            -   name: Save Composer downloads
                if: inputs.publish == true && steps.composer-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: ~/.cache/composer
                    key: composer-${{ hashFiles('**/composer.lock') }}

    compute-package-matrix:
        needs: [compute-build-matrix, build-payload]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
        outputs:
            matrix: ${{ steps.filter.outputs.matrix }}
            any: ${{ steps.filter.outputs.any }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Download target plans
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                continue-on-error: true
                with:
                    pattern: shared-plans-glibc-*
                    path: plans
            -   name: Select successful common payloads
                id: filter
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    PHP_VERSIONS: ${{ inputs.php_versions }}
                run: |
                    set -euo pipefail
                    succeeded=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
                        --jq '.jobs[] | select(.conclusion == "success") | .name | split(" / ") | last | select(test("^Build payload \\(.* php[0-9]+\\.[0-9]+\\)$"))' \
                        | sed -E 's/^Build payload \(([^ ]+) php([^)]+)\)$/\1 \2/' | sort -u)
                    python3 .github/actions/shared-libraries/workflow.py packages --plans plans \
                        --php-versions "$PHP_VERSIONS" --succeeded "$succeeded" >> "$GITHUB_OUTPUT"

    package:
        name: Package and upgrade (${{ matrix.type }} ${{ matrix.target }} php${{ matrix.php-version }})
        needs: [setup-matrix, compute-package-matrix]
        if: ${{ !cancelled() && needs.compute-package-matrix.outputs.any == 'true' }}
        runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
        permissions:
            contents: read
            packages: read
            actions: read
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.compute-package-matrix.outputs.matrix) }}
        env:
            IMAGE: ${{ matrix.image }}
            PACKAGING_IMAGE: ${{ matrix.package-image }}
            SOURCE_RUN_ID: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            TYPE: ${{ matrix.type }}
            TARGET: ${{ matrix.target }}
            MATRIX_ARCH: ${{ matrix.arch }}
            PHPV: ${{ matrix.php-version }}
            PACKAGES: ${{ matrix.packages }}
            MODE: ${{ inputs.mode || 'full' }}
            ITERATION: ${{ inputs.iteration || '' }}
            BUMP: ${{ inputs.bump || false }}
            FORGEJO_PASSWORD: ${{ secrets.FORGEJO_PASSWORD }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Log in to packaging registry
                env:
                    REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    ACTOR: ${{ github.actor }}
                run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            -   name: Download pinned source metadata
                uses: dawidd6/action-download-artifact@ac66b43f0e6a346234dd65d4d0c8fbb31cb316e5 # v11
                with:
                    workflow: spc-download.yml
                    name: downloads-tarball
                    search_artifacts: true
                    run_id: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            -   name: Extract source metadata
                run: |
                    mkdir -p downloads
                    tar --no-same-owner -xzf downloads.tar.gz -C downloads
                    rm downloads.tar.gz
            -   name: Download shared SDK metadata
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    name: shared-sdk-glibc-${{ matrix.target }}
                    path: stage
            -   name: Download common PHP payload
                if: matrix.library-only != true
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    name: shared-payload-glibc-${{ matrix.target }}-php${{ matrix.php-version }}
            -   name: Extract sealed common payload
                if: matrix.library-only != true
                run: zstd -dc php-payload.tar.zst | tar -xf -
            -   name: Download matching library packages
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    name: shared-libs-${{ matrix.type }}-${{ matrix.target }}
                    path: library-stage
            -   name: Copy matching library archives
                run: |
                    mkdir -p "dist/$TYPE"
                    find library-stage/libraries -maxdepth 1 -name "*.$TYPE" -exec cp -a {} "dist/$TYPE/" \;
            -   name: Package sealed payload without compilation
                if: matrix.library-only != true
                run: |
                    docker run --rm -v "$GITHUB_WORKSPACE":/build -w /build \
                        -e IMAGE -e SOURCE_RUN_ID -e TYPE -e TARGET -e MATRIX_ARCH -e PHPV -e PACKAGES \
                        -e MODE -e ITERATION -e BUMP -e FORGEJO_PASSWORD -e GITHUB_TOKEN \
                        "$PACKAGING_IMAGE" bash .github/actions/shared-libraries/run.sh glibc-package
            -   name: Prepare native baseline comparison tools
                run: |
                    sudo apt-get update
                    sudo apt-get install -y python3-rpm zstd
            -   name: Freeze actual published baseline
                run: python3 bin/freeze-migration-baseline.py --type "$TYPE" --php "$PHPV" --arch "$MATRIX_ARCH" --profile all --output stage/published-baseline
            -   name: Verify custom prefix extension update triggers
                if: matrix.runtime-checks == true
                run: python3 tests/runtime-consumer-triggers.py --type "$TYPE" --image "$PACKAGING_IMAGE" --output stage/consumer-trigger-native.json
            -   name: Verify ordinary static to shared upgrade
                env:
                    LIBRARY_ONLY: ${{ matrix.library-only }}
                    TLS_CHECKS: ${{ matrix.tls-checks }}
                run: |
                    args=()
                    if [[ "$TLS_CHECKS" == true ]]; then args+=(--tls); fi
                    profile=all
                    if [[ "$LIBRARY_ONLY" == true ]]; then args+=(--library-only); profile=cli,fpm,frankenphp;
                    else
                        mode=$(python3 .github/actions/shared-libraries/workflow.py upgrade-mode --baseline stage/published-baseline/baseline.json)
                        if [[ "$mode" == shared ]]; then args+=(--partial-consumers); else args+=(--individual-profiles); fi
                    fi
                    python3 tests/migration-upgrade-containers.py --type "$TYPE" --php "$PHPV" --arch "$MATRIX_ARCH" --artifacts "dist/$TYPE" --baseline-dir stage/published-baseline --report "dist/$TYPE/native-upgrade-receipt.json" --profile "$profile" "${args[@]}"
                    native_args=()
                    if [[ "$LIBRARY_ONLY" == true ]]; then native_args+=(--library-only); fi
                    python3 .github/actions/shared-libraries/workflow.py upgrade-receipt --type "$TYPE" --php-stream "$PHPV" --architecture "$MATRIX_ARCH" --report "dist/$TYPE/native-upgrade-receipt.json" --plan "stage/$TYPE/shared-library-plan.json" --packages "dist/$TYPE" --source-run-id "$SOURCE_RUN_ID" --image "$IMAGE" --output "dist/$TYPE/shared-library-upgrade-receipt.json" "${native_args[@]}"
            -   name: Stage validated consumer packages
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    overwrite: true
                    name: ${{ matrix.library-only && 'shared-validation' || 'shared-consumers' }}-${{ matrix.type }}-${{ matrix.target }}-php${{ matrix.php-version }}
                    path: dist/${{ matrix.type }}
                    retention-days: 1
            -   name: Stage failed validation receipt
                if: failure()
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: failed-upgrade-${{ matrix.type }}-${{ matrix.target }}-php${{ matrix.php-version }}
                    path: |
                        dist/${{ matrix.type }}/native-upgrade-receipt.json
                        stage/published-baseline/baseline.json
                    retention-days: 1

    publish:
        name: Publish (${{ matrix.type }} ${{ matrix.target }})
        needs: [setup-matrix, compute-build-matrix, package]
        if: ${{ !cancelled() && inputs.publish == true && needs.compute-build-matrix.outputs.publish-any == 'true' }}
        runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
        container:
            image: ${{ matrix.package-image }}
        permissions:
            contents: read
            packages: read
            actions: read
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.compute-build-matrix.outputs.publish-matrix) }}
        env:
            IMAGE: ${{ matrix.image }}
            SOURCE_RUN_ID: ${{ needs.setup-matrix.outputs.downloads-run-id }}
            TYPE: ${{ matrix.type }}
            GLIBC_PIPELINE: true
            TARGET: ${{ matrix.target }}
            MATRIX_ARCH: ${{ matrix.arch }}
            MODE: ${{ inputs.mode || 'full' }}
            FORGEJO_PASSWORD: ${{ secrets.FORGEJO_PASSWORD }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
            RPM_HOST: github@${{ secrets.DEB_SERVER_IP }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false
            -   name: Select supported Python
                run: |
                    if command -v python3.9 >/dev/null 2>&1; then
                        mkdir -p "$RUNNER_TEMP/spp-python"
                        ln -sf "$(command -v python3.9)" "$RUNNER_TEMP/spp-python/python3"
                        echo "$RUNNER_TEMP/spp-python" >> "$GITHUB_PATH"
                    fi
            -   name: Set up SSH key
                uses: webfactory/ssh-agent@d4b9b8ff72958532804b70bbe600ad43b36d5f2e # v0.8.0
                with:
                    ssh-private-key: ${{ secrets.GITHUBRPMHENDERKESPRIVATEKEY }}
            -   name: Trust repository host
                run: |
                    mkdir -p ~/.ssh
                    cat >> ~/.ssh/known_hosts <<'EOF'
                    ${{ secrets.DEB_SERVER_IP }} ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPQq0y77dDEtxECVMhCxjcqiV369goMcbInsY/d+F1yXGwqOXQ6RqIEzgaVhgq0joMJT5BiGXNXQ+OI10/KtzGI=
                    ${{ secrets.DEB_SERVER_IP }} ssh-rsa 
                    ${{ secrets.DEB_SERVER_IP }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICaB5IjokRHAH0Y9pzVe/Jx3s6cn0OADJ9uTxQQubBMu
                    EOF
                    chmod 600 ~/.ssh/known_hosts
            -   name: Set canonical RPM repository paths
                run: |
                    arch="$MATRIX_ARCH"
                    if [[ "$arch" == arm64 ]]; then arch=aarch64; fi
                    echo "RPM_DIRECTORY=/mnt/data/rpm/$arch/el8" >> "$GITHUB_ENV"
            -   name: Download complete staged cohort
                uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
                with:
                    pattern: shared-*-${{ matrix.type }}-${{ matrix.target }}*
                    path: cohort
            -   name: Assemble cohort packages
                run: bash .github/actions/shared-libraries/run.sh assemble
            -   name: Verify native ordinary upgrade receipts
                run: python3 .github/actions/shared-libraries/workflow.py verify-upgrades --source cohort --library-artifact "cohort/shared-libs-$TYPE-$TARGET" --type "$TYPE"
            -   name: Sign RPM packages
                if: matrix.type == 'rpm'
                env:
                    RPM_SIGNING_KEY: ${{ secrets.DEB_GPG_PRIVATE_KEY }}
                    RPM_SIGNING_PASSWORD: ${{ secrets.DEB_GPG_PASSWORD }}
                run: bash .github/actions/shared-libraries/sign-rpm.sh
            -   name: Verify complete cohort and all upgrade guards
                id: cohort-guard
                run: bash .github/actions/shared-libraries/run.sh publish
            -   name: Publish DEB cohort to first existing registry
                if: matrix.type == 'deb'
                run: bash .github/actions/shared-libraries/run.sh upload-1
            -   name: Publish DEB cohort to second existing registry
                if: ${{ !cancelled() && matrix.type == 'deb' && steps.cohort-guard.outcome == 'success' }}
                run: bash .github/actions/shared-libraries/run.sh upload-2
            -   name: Stage and promote canonical RPM generation
                if: matrix.type == 'rpm'
                run: bash .github/actions/shared-libraries/run.sh publish-rpm
