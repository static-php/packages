name: spc-download

on:
    schedule:
        -   cron: '0 0 * * *'
    workflow_dispatch:
        inputs:
            force_full:
                description: "Force a full rebuild of all PHP versions regardless of detected changes"
                type: boolean
                required: false
                default: false
            publish:
                description: "Publish downstream packages after a manual source update"
                type: boolean
                required: false
                default: false
            build_packages:
                description: "Dispatch package builds when source inputs change"
                type: boolean
                required: false
                default: true
            bump:
                description: "Bump downstream package revisions after a manual source update"
                type: boolean
                required: false
                default: false

permissions:
    contents: read
    actions: write

jobs:
    download:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            actions: write
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
            PHP_MINORS: "8.2 8.3 8.4 8.5 8.6"
        steps:
            -   name: Install PHP and composer
                run: |
                    sudo curl -L https://files.henderkes.com/x86_64-linux/php -o /usr/local/bin/php
                    sudo chmod +x /usr/local/bin/php
                    sudo curl -sS https://raw.githubusercontent.com/composer/getcomposer.org/f3108f64b4e1c1ce6eb462b159956461592b3e3e/web/installer | php -- --quiet
                    sudo mv composer.phar /usr/local/bin/composer

            -   name: Checkout code
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                with:
                    persist-credentials: false

            -   name: Composer install
                run: composer install

            -   name: Restore downloaded sources
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: downloads
                    key: spc-sources-${{ github.run_id }}-${{ github.run_attempt }}
                    restore-keys: spc-sources-

            -   name: Restore previous state
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: .download-state
                    key: spc-downloads-lock

            -   name: Seed empty state if missing
                run: |
                    set -euo pipefail
                    mkdir -p .download-state
                    [[ -f .download-state/lock.prev.json ]] || echo '{}' > .download-state/lock.prev.json
                    [[ -f .download-state/meta.prev.json ]] || echo '{}' > .download-state/meta.prev.json

            -   name: Download extensions
                run: |
                    set -uo pipefail
                    python3 .github/actions/shared-libraries/php-source.py --root . --restore-stable || exit 1
                    EXTS=amqp,apcu,ast,bcmath,brotli,bz2,calendar,clickhouse,ctype,curl,dba,decimal,deepclone,dio,dom,ds,ev,event,excimer,exif,fastchart,fastjson,ffi,fileinfo,filter,ftp,gd,gearman,gettext,gmp,gmssl,grpc,iconv,igbinary,imagick,inotify,intl,ldap,libxml,lz4,maxminddb,mbregex,mbstring,memcache,memcached,mongodb,msgpack,mysqli,mysqlnd,mysqlnd_parsec,mysqlnd_ed25519,odbc,opcache,openssl,opentelemetry,parallel,password-argon2,pcov,pcntl,pdo,pdo_mysql,pdo_odbc,pdo_pgsql,pdo_sqlite,pdo_sqlsrv,pgsql,phar,posix,protobuf,rar,rdkafka,readline,redis,session,shmop,simdjson,simplexml,snappy,soap,sockets,sodium,spx,sqlite3,sqlsrv,ssh2,swoole,sysvmsg,sysvsem,sysvshm,tidy,tokenizer,trader,uuid,uv,xdebug,xhprof,xlswriter,xml,xmlreader,xmlwriter,xsl,xz,yac,yaml,zip,zlib,zstd

                    # confluentinc (librdkafka's GitHub org) has an IP allow list enabled.
                    # It rejects AUTHENTICATED api.github.com requests coming from GitHub
                    # Actions runner IPs with HTTP 403 ("...IP address is not permitted..."),
                    # while ANONYMOUS requests to the same public endpoints return 200. spc
                    # always attaches GITHUB_TOKEN to GitHub sources, so its librdkafka fetch
                    # 403s. Fetch librdkafka first WITHOUT a token; the main authenticated
                    # pass below then finds it cached and skips the blocked API call.
                    # (curl --retry does not retry 403, so this must be fixed, not retried.)
                    if ! env -u GITHUB_TOKEN -u GH_TOKEN php vendor/bin/spc download librdkafka --update --retry=5; then
                        echo "::error::failed to fetch librdkafka anonymously"
                        exit 1
                    fi

                    # spc's per-request retry uses `curl --retry`, which does not retry HTTP
                    # 403. Wrap the main download in an outer retry-with-backoff loop; spc
                    # skips already-cached sources, so each retry only re-fetches the artifacts
                    # that failed and gives transient rate-limit windows time to reset.
                    attempt=1
                    max=6
                    updates=$(jq -r 'keys | map(select(. != "librdkafka")) | join(",")' downloads/.cache.json)
                    until php vendor/bin/spc download --update="$updates" --shallow-clone --retry=5 -e "$EXTS" --for-packages=frankenphp; do
                        rc=$?
                        if [ "$attempt" -ge "$max" ]; then
                            echo "::error::spc download failed after ${attempt} attempts (last exit ${rc})"
                            exit "$rc"
                        fi
                        wait=$((attempt * 30))
                        echo "spc download attempt ${attempt} failed (exit ${rc}); retrying in ${wait}s (cached sources are skipped) ..."
                        sleep "$wait"
                        attempt=$((attempt + 1))
                    done
                    echo "spc download completed on attempt ${attempt}"

            -   name: Probe upstream releases
                id: probe-upstream
                run: |
                    set -euo pipefail
                    new='{}'
                    for v in $PHP_MINORS; do
                        # php.net answers an unreleased minor with HTTP 200 and {"error":"Unknown
                        # version"}, so `keys[0]` yields the literal string "error". Only accept a
                        # key that actually looks like a version.
                        latest=$(curl -fsSL -H "Cache-Control: no-cache" "https://www.php.net/releases/index.php?json=&max=1&version=${v}&build=${GITHUB_RUN_ID}" \
                            | jq -r 'to_entries | map(select(.key | test("^[0-9]+\\.[0-9]+\\.[0-9]+"))) | .[0].key // empty')
                        # GitHub tags can precede php.net metadata; released streams stay on GA tags.
                        github_versions=$(curl -fsSL \
                            -H "Authorization: Bearer $GITHUB_TOKEN" \
                            -H "Accept: application/vnd.github+json" \
                            "https://api.github.com/repos/php/php-src/git/matching-refs/tags/php-${v}." \
                            | jq -r --arg minor "$v" --arg released "$latest" '
                                .[].ref | sub("^refs/tags/php-"; "")
                                | select(startswith($minor + "."))
                                | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+((alpha|beta|RC)[0-9]+)?$"))
                                | select($released == "" or test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
                                | select(. != "8.6.0RC1")
                            ')
                        # version_compare orders RC tags after alpha/beta, unlike sort -V.
                        latest=$(printf '%s\n' "$latest" "$github_versions" \
                            | php -r '$t = array_values(array_filter(array_map("trim", file("php://stdin")))); usort($t, "version_compare"); echo end($t) ?: "";')
                        if [[ -z "$latest" ]]; then
                            echo "::error::Failed to fetch latest PHP version for ${v}"
                            exit 1
                        fi
                        echo "PHP ${v} latest: ${latest}"
                        new=$(jq --arg v "$v" --arg l "$latest" '. + {($v): $l}' <<< "$new")
                    done

                    pie_latest=$(curl -fsSL \
                        -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/repos/php/pie/releases/latest" \
                        | jq -r '.tag_name // empty')
                    if [[ -z "$pie_latest" ]]; then
                        echo "::error::Failed to fetch latest pie release"
                        exit 1
                    fi
                    echo "pie latest: ${pie_latest}"

                    mkdir -p downloads
                    jq --argjson v "$new" --arg pie "$pie_latest" -n \
                        '{php_versions: $v, pie_version: $pie}' > downloads/.spc-meta.json

            -   name: Freeze pinned PIE release
                run: python3 bin/freeze-pie.py --downloads downloads

            -   name: Freeze extension source profiles
                run: |
                    set -euo pipefail
                    python3 .github/actions/shared-libraries/php-source.py --root . --capture-extensions --profile stable
                    artifacts=$(python3 .github/actions/shared-libraries/php-source.py --root . --custom-git-artifacts)
                    if [[ -n "$artifacts" ]]; then
                        mapfile -t git_args < <(python3 .github/actions/shared-libraries/php-source.py --root . --custom-git-args)
                        php vendor/bin/spc download "$artifacts" "${git_args[@]}" --shallow-clone --retry=5
                    fi
                    python3 .github/actions/shared-libraries/php-source.py --root . --capture-extensions --profile custom
                    python3 .github/actions/shared-libraries/php-source.py --root . --restore-stable

            -   name: Download pinned PHP source archives
                run: |
                    set -euo pipefail
                    for minor in $PHP_MINORS; do
                        release=$(jq -er --arg minor "$minor" '.php_versions[$minor]' downloads/.spc-meta.json)
                        if ! python3 .github/actions/shared-libraries/php-source.py --root . --version "$release" --select; then
                            php vendor/bin/spc download php-src --with-php="$release" --ignore-cache-sources=php-src --retry=5
                            python3 .github/actions/shared-libraries/php-source.py --root . --version "$release" --capture
                        fi
                    done

            -   name: Save downloaded sources
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: downloads
                    key: spc-sources-${{ github.run_id }}-${{ github.run_attempt }}

            -   name: Diff state and compute triggers
                id: diff
                env:
                    FORCE_FULL: ${{ inputs.force_full }}
                run: |
                    set -euo pipefail
                    args=()
                    if [[ "$FORCE_FULL" == "true" ]]; then
                        args+=(--force-full)
                    fi
                    python3 .github/actions/shared-libraries/source-plan.py "${args[@]}" | tee -a "$GITHUB_OUTPUT"
                    {
                        echo '## Source build plan'
                        echo '```json'
                        cat downloads/build-plan.json
                        echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Persist current state for next run
                if: hashFiles('downloads/.cache.json') != ''
                run: |
                    set -euo pipefail
                    cp downloads/.cache.json    .download-state/lock.prev.json
                    cp downloads/.spc-meta.json .download-state/meta.prev.json

            -   name: Delete previous state cache
                if: (github.event_name == 'schedule' || inputs.publish == true) && hashFiles('downloads/.cache.json') != ''
                continue-on-error: true
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    gh api -X DELETE \
                        "/repos/$GITHUB_REPOSITORY/actions/caches?key=spc-downloads-lock" \
                        2>/dev/null || true

            -   name: Save state cache
                if: (github.event_name == 'schedule' || inputs.publish == true) && hashFiles('downloads/.cache.json') != ''
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
                with:
                    path: .download-state
                    key: spc-downloads-lock

            -   name: Create tarball (keep permissions)
                if: steps.diff.outputs.any_change == 'true' || github.event_name == 'workflow_dispatch'
                run: |
                    tar -czf downloads.tar.gz -C downloads .

            -   name: Upload downloads directory
                if: steps.diff.outputs.any_change == 'true' || github.event_name == 'workflow_dispatch'
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                    name: downloads-tarball
                    path: downloads.tar.gz
                    retention-days: 14

            -   name: Trigger downstream workflows
                if: steps.diff.outputs.any_change == 'true' && (github.event_name == 'schedule' || inputs.build_packages)
                env:
                    GH_TOKEN: ${{ secrets.GH_PAT }}
                    PUBLISH: ${{ inputs.publish || false }}
                    BUMP: ${{ inputs.bump || false }}
                run: |
                    set -euo pipefail
                    for workflow in build-rpm-modular-packages.yml build-apk-forgejo.yml; do
                        args=(-f mode=incremental -f downloads_run_id="$GITHUB_RUN_ID" -f publish="$PUBLISH" -f bump="$BUMP")
                        gh workflow run "$workflow" --ref "$GITHUB_REF_NAME" "${args[@]}"
                    done
